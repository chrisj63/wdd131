<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 Portfolio - Modal.">
    <meta name="author" content="Chris Johnson">
        <!-- https://chrisj63.github.io/wdd131/ponder/modal.html -->
    <title>Modals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="modal.css" rel="stylesheet">
    <script src="modal.js" defer></script>
</head>
<body>
    <h1>Gallery</h1>
    <section class="gallery">
        <figure>  
            <img src="images/modal/book-sm.jpg" alt="person reading a book">
        </figure>
        <figure>  
            <img src="images/modal/couch-sm.jpg" alt="person sitting on a couch with a phone">
        </figure>
        <figure>  
            <img src="images/modal/desk-sm.jpg" alt="a work desktop">
        </figure>
        <figure>  
            <img src="images/modal/keyboard-sm.jpg" alt="person typing on a keyboard">
        </figure>
        <figure>  
            <img src="images/modal/phone-sm.jpg" alt="person looking at a phone">
        </figure>
        <figure>  
            <img src="images/modal/sit-sm.jpg" alt="person sitting on a couch">
        </figure>
    </section>
    <dialog>
        <img>
        <button class="close-viewer">X</button>
    </dialog>    
</body>
</html>
