<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="WDD 131 Portfolio - Final - Triangles.">
        <meta name="author" content="Chris Johnson">
            <!-- https://chrisj63.github.io/wdd131/triangle/index.html -->
        <title>Triangles</title>
        <link rel="icon" href="../images/favicon.ico">
        <link rel="stylesheet" href="../css/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="../css/triangle.css" rel="stylesheet">
        <script src="../js/triangle.js" defer></script>
    </head>
    <body>    
        <header>
            <div id="top">
                <img id="logo" src="../images/triLogo2.png" alt="picture of logo - right triangle">
                <h1>Triangles</h1>
            </div>
            <button class="menu-btn">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </button>
            <nav>
                <a href="../index.html">Home</a>
                <a href="../subPages/right.html">Right Triangle</a>
                <a href="../subPages/isosceles.html">Isosceles Triangle</a>
                <a href="../subPages/obtuse.html">Obtuse Triangle</a>
                <a href="../subPages/acute.html">Acute Triangle</a>
                <a href="../subPages/formula.html">Formulas</a>
            </nav>
        </header>
        <main class="cards">
            <section class="card">
                <div id="cardTop">
                    <img class="acuteImage" src="../images/TriangleSectionTemplateWhiteIsosceles.webp" alt="Isosceles Triangle image">
                </div>
                <div id="cardMiddle">
                    <h1 class="name">Acute</h1>
                </div>
                <div id="cardBottom" class="stats">
                    <p id="status">Status: Enter angles and/or side lengths</p>
                    <p id="formula">Formula: formula</p>
                    <p id="level">Use Side Angle Side or Angle Side Angle</p>
                    <p id="instructions">Enter only numbers. Click Solve.</p>
                </br>
                <section class="sidesAndAngles">
                    <div class="sides">   
                        <div id="A" class="fullField">
                            <label for="sideA">A</label>
                            <input id="sideA" name="sideA" type="number" placeholder = "Side A length. Numbers only."/>
                        </div>
                        <div id="B" class="fullField">
                            <label for="sideB">B</label>
                            <input id="sideB" name="sideB" type="number" placeholder = "Side B length. Numbers only."/>
                        </div>
                        <div id="C" class="fullField">
                            <label for="sideC">C</label>
                            <input id="sideC" name="sideC" type="number" placeholder = "Side C length. Numbers only."/>
                        </div>
                    </div>
                    </br>
                    <div class="angles">    
                        <div id="x" class="fullField">
                            <label for="anglex">x</label>
                            <input id="anglex" name="anglex" type="number" placeholder = "90"/>
                        </div>
                        <div id="y" class="fullField">
                            <label for="angley">y</label>
                            <input id="angley" name="angley" type="number" placeholder = "Angle y in degrees. Numbers only."/>
                        </div>
                        <div id="z" class="fullField">
                            <label for="anglez">z</label>
                            <input id="anglez" name="anglez" type="number" placeholder = "Angle z in degrees. Numbers only."/>
                        </div>
                    </div>
                </section>
                </div>
                <div id="cardButtons" class="buttons">
                    <button id="buttonSolve" type="submit">Solve</button>
                    <button id="buttonReset" type="submit">Reset</button>
                </div>
            </section>   
        </main>
        <footer>
            <p>&copy; 2026 Lavell Apps. All Rights Reserved.</p>
            <p id="version">Triangles version 0.2</p>
        </footer>
    </body>
</html>
