<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="WDD 131 Portfolio - chrisj63 - Week 10 Recipes part 2 prove assignment.">
        <meta name="author" content="Chris Johnson">
            <!-- https://chrisj63.github.io/wdd131/recipes/index.html -->
        <title>Recipe Book</title>
        <link rel="icon" href="images/favicon.ico">
        <!-- One Apple Touch Icon (iOS home screen) -->
        <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png"> 
        <link rel="stylesheet" href="./css/normalize.min.css" />
        
        <link href="recipes.css" rel="stylesheet">
        <script src="recipes.js" defer></script>
       
        <!-- Open Graph (Facebook, LinkedIn, etc.) -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="Recipe Book">
        <meta property="og:description" content="A simple recipe book web app for finding and exploring recipes.">
        <meta property="og:url" content="https://chrisj63.github.io/wdd131/recipes/index.html">
        <meta property="og:image" content="https://chrisj63.github.io/wdd131/recipes/images/social-preview-image.jpg">

        <!-- X Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Recipe Book">
        <meta name="twitter:description" content="A simple recipe book web app for finding and exploring recipes.">
        <meta name="twitter:image" content="https://chrisj63.github.io/wdd131/recipes/images/social-preview-image.jpg">

        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

    </head>
    <body>
        <header>   
            <figure>  
                <img src="images/recipe-book.png" alt="small drawing of a book with chef hat on front">
            </figure>
            <h1>RECIPE BOOK</h1>
        </header>
        <main>
            <div class="search-bar">
                <div class="search">
                    <label for="searchInput" placeholder="Find a recipe"></label>
                    <input id="searchInput" name="searchInput" type="text" placeholder="Find a recipe"/>
                    <div id="search-icon" class="search-icon">
                        <img id="searchButton" src="images/search.svg" alt="magnifying glass icon">
                    </div>
                </div>
            </div>
            <hr>
            <section class="recipe-container" id="recipe-container">
                        <img src="images/apple-crisp.jpg" alt="picture of apple crisp in a bowl with a scoup of ice cream">
                    <section class="recipe-name-rating">
                        <div id="recipe-content">
                            <h3>dessert</h3>
                        </div>
                        <h2>Apple Crisp</h2>
                        <span 
                        class="rating"
                        role="img"
                        aria-label="Rating: 4 out of 5 stars"
                        >
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                        </span>
                        <p>This apple crisp recipe is a simple  yet delicious fall dessert yhat's great served warm with vanilla ice cream.</p>
                    </section>
            </section>                       
        </main>
        <footer>
            <section class="bottom">
                <div class="social">
                    <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
                    <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
                    <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
                    <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
                </div>  
                <div class="freeicons">
                    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>    
                </div>
            </section>
        </footer>
    </body>
</html>
