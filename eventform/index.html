<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="WDD 131 Portfolio - chrisj63 - Week 7 Ticket Form prove assignment.">
        <meta name="author" content="Chris Johnson">
            <!-- https://chrisj63.github.io/wdd131/eventform/index.html -->
        <title>Event Ticket Form</title>
        <link rel="icon" href="images/favicon.ico">    
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="eventform.css" rel="stylesheet">
        <script src="eventform.js" defer></script>
    </head>
    <body>
        <main class="wrapper">
        <h1>Event Ticket</h1>
        <form id="ticketform">
        <div class="field">
            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" required />
        </div>
        <div class="field">
            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" required />
        </div>
        <div class="field full">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
        </div>
        <div class="field">
            <label for="type">Type</label>
            <select
            id="type"
            name="type"
            aria-controls="Student or Guest choice"
            required
            >
            <option value="chooseone">Choose one</option>
            <option value="student">Student</option>
            <option value="guest">Guest</option>
            </select>
        </div>
        <div class="field">
            <label for="availableDate">Event Date</label>
            <input id="availableDate" name="availableDate" type="date" required />
        </div>
        <div id="studentContainer" class="field full" hidden>
            <label for="student">Student I#</label>
            <input id="student" name="student" type="text" placeholder = "Enter 9 numbers. No spaces or dashes." pattern="[0-9]{9}"/>
        </div>
        <div id="guestContainer" class="field full" hidden>
            <label for="guest">Access Code</label>
            <input id="guest" name="guest" type="text" />
        </div>
            <button class="full" type="submit">Create Ticket</button>
        </form>
        <section id="output" aria-live="polite"></section>
        </main> 
    </body>
</html>
